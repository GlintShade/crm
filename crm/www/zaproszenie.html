<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Zaproszenie — CRM ProEnergy</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: #f4f5f7;
			margin: 0;
			padding: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.card {
			background: #ffffff;
			border-radius: 12px;
			box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
			padding: 40px;
			max-width: 420px;
			width: 90%;
			text-align: center;
			box-sizing: border-box;
		}
		h1 {
			font-size: 1.25rem;
			margin: 0 0 16px;
			color: #1a1a1a;
		}
		p {
			color: #4b5563;
			line-height: 1.5;
			margin: 0 0 24px;
		}
		button {
			background: #2563eb;
			color: #ffffff;
			border: none;
			border-radius: 8px;
			padding: 12px 24px;
			font-size: 1rem;
			cursor: pointer;
		}
		button:disabled {
			opacity: 0.6;
			cursor: default;
		}
		.error {
			color: #dc2626;
			margin-top: 16px;
			font-size: 0.9rem;
			display: none;
		}
	</style>
</head>
<body>
	<div class="card">
		<h1>CRM ProEnergy</h1>
		{% if wazne %}
			<p>Zostałeś zaproszony do CRM ProEnergy.</p>
			<button id="accept-btn" type="button">Przyjmij zaproszenie</button>
			<div id="error-msg" class="error"></div>
		{% else %}
			<p>Zaproszenie jest nieważne lub wygasło.</p>
		{% endif %}
	</div>

	{% if wazne %}
	<script>
		(function () {
			var invitationKey = {{ klucz_json | safe }};
			var csrfToken = {{ csrf_token_json | safe }};
			var btn = document.getElementById('accept-btn');
			var errorMsg = document.getElementById('error-msg');

			btn.addEventListener('click', function () {
				btn.disabled = true;
				errorMsg.style.display = 'none';

				fetch('/api/method/crm.api.accept_invitation', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'X-Frappe-CSRF-Token': csrfToken
					},
					body: JSON.stringify({ key: invitationKey })
				}).then(function (response) {
					if (response.ok) {
						window.location = '/crm';
					} else {
						btn.disabled = false;
						errorMsg.textContent = 'Nie udało się przyjąć zaproszenia — link mógł wygasnąć.';
						errorMsg.style.display = 'block';
					}
				}).catch(function () {
					btn.disabled = false;
					errorMsg.textContent = 'Nie udało się przyjąć zaproszenia — link mógł wygasnąć.';
					errorMsg.style.display = 'block';
				});
			});
		})();
	</script>
	{% endif %}
</body>
</html>
